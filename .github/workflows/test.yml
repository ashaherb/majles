name: test

# Runs on ready pull requests only, never on a push or a draft
# (.claude/rules/git.md): Actions minutes on a private repo are a monthly allowance.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        # macOS minutes cost ten times Linux's on a private repo; they are free once
        # the repo is public, and only then does macOS join (DECISIONS.md, entry 6).
        os: ${{ github.event.repository.private && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: |
          python -m unittest discover -s majlis -p 'test_*.py'
          python -m unittest tools/test_render_decisions.py tools/test_render_status.py
      - name: Wheel installs and runs
        run: |
          python -m pip wheel . --no-deps -w dist -q
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q dist/*.whl
          "$RUNNER_TEMP/venv/bin/majlis" --version
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/majlis" new demo
