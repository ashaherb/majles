[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "majles"
dynamic = ["version"]
description = "An agent team and working rules for Claude Code projects, and the CLI that keeps them in step."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Shaher" }]
keywords = ["claude-code", "agents", "project-template", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
majles = "majles.cli:main"

[project.urls]
Homepage = "https://github.com/ashaherb/majles"
Repository = "https://github.com/ashaherb/majles"
Issues = "https://github.com/ashaherb/majles/issues"
Changelog = "https://github.com/ashaherb/majles/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["majles"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "majles.__version__" }

# A local-path install (`uv tool install <checkout>`) is rebuilt only when a cache
# key changes. uv's default keys are pyproject.toml, setup.py and setup.cfg, so an
# edited .py file with the same version was served from a stale cached build.
# Setting the keys replaces the defaults, so those stay listed first.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "setup.cfg" },
    { file = "majles/**/*.py" },
    { file = "majles/manifest.txt" },
    { file = "template/**/*" },
    { file = ".claude/**/*" },
    { git = { commit = true } },
]
